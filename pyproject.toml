[project]
name = "laboratorio-adk-ucv"
version = "0.1.0"
description = "Mono-agente basico con Google ADK - UCV"
authors = [
    {name = "Cesar Alexander Rojas Sinche",email = "alexanderojasinche@gmail.com"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk (>=2.13.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
